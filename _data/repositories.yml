main_repositories:
  - name: detectifz
    url: https://github.com/fsarron/detectifz
    description: DETECTIFz is a galaxy group finder algorithm for multiband photometric galaxy surveys.
    platform: github
    language: Python

  - name: photXclus
    url: https://codeberg.org/fsarron/photXclus
    description: Bayesian redshift inference of X-ray detected clusters using photometric redshifts.
    platform: codeberg
    language: Python

  - name: bacycle
    url: https://codeberg.org/Bacycle/bacycle
    description: Bayesian inference of bacteria DNA replication cycles.
    platform: codeberg
    language: Python
    
contrib_repositories:
  - name: deepinv
    url: https://github.com/deepinv/deepinv
    description: DeepInverse is a PyTorch library for solving imaging inverse problems using deep learning.
    platform: github
    language: Python
    stars: 648
   
  - name: dissect
    url: https://src.koda.cnrs.fr/alain.kamgoue.3/dissect-visualization
    description: DISSECT is a tool to segment and explore cells and tissues mechanics in highly deformed 3D epithelia.
    platform: gitlab
    language: Python 
    
    
    
